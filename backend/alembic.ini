# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, must be a timezone-aware date/datetime.
# timezone =

# max length of characters to use when auto-generated
# migration file names
# truncate_transaction_length =

# set to 'true' to run the environment during
# the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions
# sourceless = false

# version locations specifies the path that conains
# the version information
# version_locations = %(here)s/bar:%(here)s/bat:migrations:%(here)s/baz

# version path separator; as mentioned above, it is : that
# will be used by Alembic in order to determine when ever
# a migration is needed to generate, which depends on the
# present revision configs.
# version_path_separator = :
# Version path separator; It is recommended that you set this
# value to whatever your project uses, but you can leave it
# commented out and alembic will just use : as a separator.
# If you use : as a separator it will make it hard to generate
# migration files for paths that contain that separator,
# so be careful!
# version_path_separator = :
# version_path_separator = os.pathsep

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are called
# on new revision scripts.  This hook is defined in the key
# ``post_write`` in the ``[run_hooks]`` section, when ``revised`` generates
# a script.

# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME
# black.type = free_python_function
# black.function = black.main

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s - %(message)s
datefmt = %H:%M:%S
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: foodstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin@db:5432/foodstore
      SECRET_KEY: cambia-esto-por-una-clave-de-64-caracteres-minimo
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MP_ACCESS_TOKEN: TEST-tu-access-token-de-mercadopago
      MP_PUBLIC_KEY: TEST-tu-public-key-de-mercadopago
      CORS_ORIGINS: '["http://localhost:5173"]'
      # Seed DB connection (pg8000 reads these env vars)
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: admin
      PGDATABASE: foodstore
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
